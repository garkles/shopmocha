<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Basketly - Shopping List</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body class="shopping-page-body">


    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <nav class="navbar">

        <div class="nav-logo">

            <a href="index.html">
                Basketly
            </a>

        </div>


        <div class="nav-links">
            
                        <a
                            href="dashboard.html"
                            id="dashboard_nav_link"
                        >
                            Dashboard
                        </a>

            <a href="index.html">
                Shopping List
            </a>

            <a
                href="catalogue.html"
                id="catalogue_nav_link"
            >
                Stores
            </a>

            <a
                href="login.html"
                id="login_nav_link"
            >
                Sign In
            </a>

            <a
                href="register.html"
                id="register_nav_link"
            >
                Create Account
            </a>

            <span
                id="signed_in_nav"
                style="display: none;"
            >
                Signed in as
                <strong id="nav_user_email"></strong>
            </span>

            <button
                id="logout_button"
                type="button"
                style="display: none;"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="shopping-page">

        <section class="shopping-container">


            <!-- ======================================
                 HEADER
            ======================================= -->

            <div class="shopping-header">

                <div class="shopping-header-icon">
                    🛒
                </div>

                <div>

                    <h1>
                        Shopping List
                    </h1>

                    <p>
                        Build your perfect shopping list,
                        one item at a time.
                    </p>

                </div>

            </div>



            <!-- ======================================
                 CURRENT LIST NAME
            ======================================= -->

            <div class="current-list-header">

                <div>

                    <span class="list-label">
                        CURRENT LIST
                    </span>

                    <h2 id="current_list_name">
                        New Shopping List
                    </h2>

                </div>

            </div>



            <!-- ======================================
                 ADD ITEM
            ======================================= -->

            <div class="add-item-section">

                <div class="section-heading">

                    <div class="section-icon">
                        ➕
                    </div>

                    <div>

                        <h3>
                            Add an Item
                        </h3>

                        <p>
                            Add something to your shopping list.
                        </p>

                    </div>

                </div>


                <form
                    id="shopping_list_form"
                    onsubmit="return false;"
                >

                    <div class="form-group">

                        <label for="title">
                            Item
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="e.g. Milk"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="e.g. 2 litre full cream"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-group quantity-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            value="1"
                            min="1"
                            step="1"
                            required
                        >

                    </div>


                    <button
                        type="button"
                        id="add_shopping_list_item_button"
                    >

                        <span>
                            +
                        </span>

                        Add to Shopping List

                    </button>

                </form>

            </div>



            <!-- ======================================
     LIST SUMMARY
======================================= -->

<div class="list-summary">

    <div class="list-counter">

        <span>
            Items remaining
        </span>

        <strong id="item_count">
            0
        </strong>

    </div>


    <div class="list-total">

        <span>
            Estimated Total
        </span>

        <strong id="shopping_list_total">
            R0.00
        </strong>

    </div>

</div>
            <!-- ======================================
                 SHOPPING LIST
            ======================================= -->

            <div class="shopping-list-section">

                <div
                    id="content"
                    class="shopping-list-content"
                >
                </div>

            </div>



            <!-- ======================================
                 ACTIONS
            ======================================= -->

            <div class="list-actions">

                <button
                    type="button"
                    id="save_shopping_list_button"
                    class="primary-action"
                >
                    💾 Save Shopping List
                </button>


                <button
                    type="button"
                    id="rename_list_button"
                    class="secondary-action"
                    style="display: none;"
                >
                    ✏️ Rename List
                </button>


                <button
                    type="button"
                    id="delete_list_button"
                    class="danger-action"
                    style="display: none;"
                >
                    🗑️ Delete List
                </button>

            </div>


        </section>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>


    <script
        type="module"
        src="js/navbar.js"
    ></script>


</body>

</html>
