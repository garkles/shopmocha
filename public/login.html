<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - Basketly</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="nav-logo">

            <a href="index.html">
                Basketly
            </a>

        </div>


        <div class="nav-links">

            <a
                href="dashboard.html"
                id="dashboard_nav_link"
            >
                Dashboard
            </a>

            <a href="index.html">
                Shopping List
            </a>

            <a href="catalogue.html" id="catalogue_nav_link">
                Checkers Catalogue
            </a>
            


            <!-- Logged out -->

            <a
                href="login.html"
                id="login_nav_link"
            >
                Sign In
            </a>


            <a
                href="register.html"
                id="register_nav_link"
            >
                Create Account
            </a>


            <!-- Logged in -->

            <span
                id="signed_in_nav"
                style="display: none;"
            >
                Signed in as
                <strong id="nav_user_email"></strong>
            </span>


            <button
                id="logout_button"
                type="button"
                style="display: none;"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="auth-page">


        <div class="auth-container">


            <!-- Icon -->

            <div class="auth-logo">
                🔐
            </div>


            <!-- Heading -->

            <h1>
                Welcome Back
            </h1>


            <p class="auth-subtitle">
                Sign in to access your shopping lists.
            </p>



            <!-- Login Form -->

            <form id="login_form" class="auth-form">


                <div class="form-group">

                    <label for="login_email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login_email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="login_password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login_password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="auth-submit-button"
                >
                    Sign In
                </button>


            </form>



            <!-- Error -->

            <p
                id="login_error"
                class="auth-error"
            ></p>



            <!-- Register -->

            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/auth.js"
    ></script>


    <script
        type="module"
        src="js/navbar.js"
    ></script>


</body>

</html>
